services:
  zoo1:
    image: zookeeper:3.9.6-jre-17
    container_name: zoo1
    hostname: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,srvr"
    volumes:
      - zoo1-data:/data
      - zoo1-datalog:/datalog

  zoo2:
    image: zookeeper:3.9.6-jre-17
    container_name: zoo2
    hostname: zoo2
    ports:
      - "2182:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,srvr"
    volumes:
      - zoo2-data:/data
      - zoo2-datalog:/datalog

  zoo3:
    image: zookeeper:3.9.6-jre-17
    container_name: zoo3
    hostname: zoo3
    ports:
      - "2183:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,srvr"
    volumes:
      - zoo3-data:/data
      - zoo3-datalog:/datalog

volumes:
  zoo1-data:
  zoo1-datalog:
  zoo2-data:
  zoo2-datalog:
  zoo3-data:
  zoo3-datalog: